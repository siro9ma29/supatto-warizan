<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe9a8">
<title>スパッと！わり算マスター</title>
<style>
:root{
  --ink:#3b2f5c;
  --ink-soft:#6b5f8c;
  --green:#22c55e;
  --green-dk:#15803d;
  --red:#f43f5e;
  --gold:#f5b301;
  --card:#ffffff;
  --shadow:0 6px 0 rgba(59,47,92,.18);
  --shadow-press:0 2px 0 rgba(59,47,92,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#fff4c9 0%,#ffe1ef 55%,#d9ecff 100%);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body.fever{
  background:linear-gradient(120deg,#ff9a9e,#fecf6a,#fff27a,#9cf6a8,#8fd3ff,#c5a3ff,#ff9ad5,#ff9a9e);
  background-size:400% 400%;
  animation:rainbow 2.4s linear infinite;
}
@keyframes rainbow{0%{background-position:0% 50%}100%{background-position:100% 50%}}

#app{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column;}
.screen{
  display:none;flex:1;min-height:0;flex-direction:column;position:relative;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  gap:clamp(6px,1.4vh,12px);
}
.screen.active{display:flex;}

button{font:inherit;color:inherit;border:none;cursor:pointer;}
.btn{
  background:var(--card);border-radius:22px;box-shadow:var(--shadow);
  transition:transform .08s, box-shadow .08s, filter .2s;
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:var(--shadow-press);}
.mini{
  font-size:clamp(13px,1.9vmin,16px);font-weight:700;padding:8px 14px;border-radius:14px;
  background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(59,47,92,.15);color:var(--ink-soft);
  min-height:40px;white-space:nowrap;
}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,47,92,.15);}
.mini.arm{background:#ffe4e6;color:#be123c;}

#muteBtn{
  position:fixed;z-index:60;
  top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
  width:52px;height:52px;border-radius:50%;font-size:26px;line-height:52px;text-align:center;
  background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(59,47,92,.18);
}
#muteBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,47,92,.18);}

/* ================= タイトル画面 ================= */
.t-head{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vh,10px);}
.logo{text-align:center;line-height:1.05;margin-top:clamp(2px,1vh,10px);font-weight:900;letter-spacing:.02em;}
.logo-a{
  display:inline-block;font-size:clamp(24px,5.8vmin,54px);color:#ff5e8a;
  text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,5px 6px 0 rgba(59,47,92,.2);
  transform:rotate(-4deg);animation:wobble 2.6s ease-in-out infinite;
}
.logo-b{
  display:block;font-size:clamp(30px,7.4vmin,70px);color:#3b82f6;
  text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,6px 7px 0 rgba(59,47,92,.2);
}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg) scale(1.05)}}
.rank{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(100%,560px);}
.rank-badge{
  font-size:clamp(16px,3.2vmin,26px);font-weight:900;padding:5px 18px;border-radius:999px;
  background:linear-gradient(135deg,#fff3b0,#ffd166);box-shadow:0 4px 0 #e0a800;color:#7a4b00;border:3px solid #fff;
}
.rank-info{font-size:clamp(12px,2.1vmin,16px);font-weight:700;color:var(--ink-soft);text-align:center;}
.rank-bar{width:100%;height:9px;border-radius:99px;background:rgba(255,255,255,.8);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff8fab);border-radius:99px;}

.modes{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);width:min(100%,720px);margin:0 auto;}
.mode{
  flex:1;min-height:0;max-height:130px;display:flex;align-items:center;gap:clamp(8px,2vmin,18px);
  padding:clamp(6px,1.2vh,12px) clamp(12px,2.6vmin,22px);text-align:left;color:#fff;
  border:4px solid rgba(255,255,255,.9);
}
.mode.all{background:linear-gradient(135deg,#ff7eb3,#ffb347 35%,#5ee7a0 70%,#5aa9ff);box-shadow:0 6px 0 #c2508a;}
.mode.easy{background:linear-gradient(135deg,#4ade80,#16a34a);box-shadow:0 6px 0 #15803d;}
.mode.hard{background:linear-gradient(135deg,#fb923c,#e11d48);box-shadow:0 6px 0 #9f1239;}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)!important;}
.m-icon{font-size:clamp(28px,6vmin,52px);filter:drop-shadow(0 3px 0 rgba(0,0,0,.15));}
.m-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.m-text b{font-size:clamp(19px,4.2vmin,36px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap;}
.m-text small{font-size:clamp(12px,2.2vmin,18px);font-weight:700;opacity:.95;}
.m-text .stamp{font-size:clamp(11px,1.9vmin,15px);font-weight:900;background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;align-self:flex-start;}
.m-best{
  background:rgba(255,255,255,.92);color:var(--ink);border-radius:16px;padding:6px 10px;text-align:center;
  font-size:clamp(11px,1.9vmin,15px);font-weight:700;min-width:clamp(78px,15vmin,120px);line-height:1.25;
}
.m-best b{font-size:clamp(18px,3.5vmin,30px);color:#e11d48;}
.m-best.none b{font-size:clamp(13px,2.3vmin,18px);color:var(--ink-soft);}

.sub-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.5vh,14px);width:min(100%,720px);margin:0 auto;}
.sub-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:clamp(6px,1.2vh,10px) 12px;text-align:left;
  min-height:clamp(64px,10vh,96px);border:3px solid #fff;overflow:hidden;
}
.sub-btn .s-title{font-size:clamp(16px,3.2vmin,26px);font-weight:900;white-space:nowrap;}
.sub-btn .s-info{font-size:clamp(11px,2vmin,15px);font-weight:700;color:var(--ink-soft);line-height:1.3;}
#tokuBtn{background:linear-gradient(135deg,#fff1e6,#ffd8c2);}
#tokuBtn .s-title{color:#c2410c;}
#tokuBtn.off{filter:grayscale(.8);opacity:.75;}
#boxBtn{background:linear-gradient(135deg,#f3e8ff,#dbeafe);}
#boxBtn .s-title{color:#6d28d9;}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-height:2.2em;overflow:hidden;}
.chip{font-weight:900;font-size:clamp(11px,1.9vmin,15px);padding:1px 7px;border-radius:9px;background:#fff;border:2px solid #fdba74;color:#9a3412;white-space:nowrap;}
.chip.lv3{border-color:#f43f5e;color:#9f1239;}
.chip.crack{border-color:#7c6fb0;color:#4c1d95;}
.today-grow{color:#7c3aed!important;font-weight:900!important;}

/* ================= プレイ画面 ================= */
.p-top{display:flex;align-items:center;gap:10px;padding-right:62px;min-height:52px;}
.timer{flex:1;text-align:center;font-weight:900;font-size:clamp(22px,4.6vmin,40px);font-variant-numeric:tabular-nums;white-space:nowrap;}
.timer small{font-size:.5em;margin-left:3px;color:var(--ink-soft);}
.combo-small{font-weight:900;font-size:clamp(14px,2.4vmin,20px);padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.85);color:#e11d48;min-width:76px;text-align:center;visibility:hidden;}
.combo-small.show{visibility:visible;}
.qcount{font-weight:900;font-size:clamp(16px,3vmin,26px);background:#fff;border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 rgba(59,47,92,.15);font-variant-numeric:tabular-nums;white-space:nowrap;}
.qcount b{color:#3b82f6;font-size:1.25em;}
.rule-note{text-align:center;font-size:clamp(11px,1.9vmin,15px);font-weight:900;color:#be123c;margin-top:-4px;}
.rule-note.toku{color:#c2410c;}

.race{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.7);border-radius:18px;padding:8px 12px;}
.lane{display:flex;align-items:center;gap:8px;}
.lane-label{width:4.6em;font-size:clamp(12px,2vmin,15px);font-weight:900;text-align:right;flex:none;}
.track{flex:1;position:relative;height:clamp(16px,2.6vh,24px);border-radius:99px;background:#eceaf5;box-shadow:inset 0 2px 3px rgba(0,0,0,.1);margin-right:18px;}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;}
.fill.me{background:linear-gradient(90deg,#86efac,#22c55e);transition:width .35s cubic-bezier(.3,1.4,.6,1);}
.fill.gh{background:linear-gradient(90deg,rgba(167,139,250,.25),rgba(139,92,246,.5));}
.fill .head{position:absolute;right:-16px;top:50%;transform:translateY(-55%);font-size:clamp(20px,3.4vh,30px);line-height:1;}
.lane.ghost .head{opacity:.65;animation:float 1.2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(-60%)}50%{transform:translateY(-40%)}}
.nobest{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.8vmin,14px);font-weight:700;color:#9b93b8;}
.lane.ghost.empty .fill{display:none;}
.lane.ghost:not(.empty) .nobest{display:none;}
.lane.ghost.hide{display:none;}

.play-main{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(8px,1.4vh,12px);}
.q-side{min-height:0;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.82);border-radius:24px;padding:8px 10px;box-shadow:var(--shadow);border:3px solid #fff;position:relative;}
.badges{display:flex;justify-content:center;gap:8px;min-height:30px;flex-wrap:wrap;}
.weak-badge,.fever-badge,.crack-badge{display:none;font-weight:900;font-size:clamp(13px,2.3vmin,18px);padding:3px 12px;border-radius:99px;align-items:center;white-space:nowrap;}
.weak-badge{background:linear-gradient(135deg,#ff8a00,#ff3d3d);color:#fff;box-shadow:0 3px 0 #b91c1c;animation:pulse .8s ease-in-out infinite;}
.crack-badge{background:#ede9fe;color:#5b21b6;box-shadow:0 3px 0 #c4b5fd;}
.fever-badge{background:linear-gradient(90deg,#ff5e8a,#ffb347,#ffe14d,#5ee7a0,#5aa9ff,#b47cff);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 3px 0 rgba(0,0,0,.2);}
.weak-badge.show,.fever-badge.show,.crack-badge.show{display:inline-flex;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.blocks{flex:1;min-height:50px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;--s:24px;}
.pile{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:calc(var(--s)*.14);max-width:100%;}
.groups{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:calc(var(--s)*.6) calc(var(--s)*.75);max-width:100%;}
.grp{display:grid;gap:calc(var(--s)*.12);padding:calc(var(--s)*.16);border-radius:calc(var(--s)*.45);background:rgba(255,255,255,.65);box-shadow:0 0 0 2px var(--c) inset;animation:spa .36s cubic-bezier(.2,1.5,.5,1) both;}
@keyframes spa{0%{transform:translateX(var(--dx)) scale(.8);opacity:.5}55%{transform:translateX(calc(var(--dx) * -0.18)) scale(1.14)}100%{transform:none;opacity:1}}
.blk{display:block;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,0) 30%),linear-gradient(145deg,#93c5fd,#3b82f6);box-shadow:inset 0 calc(var(--s)*-.1) 0 rgba(0,0,0,.15);}
.pile .blk{animation:blkIn .25s ease-out both;}
@keyframes blkIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.grp .blk{background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,0) 30%),var(--c);}
.slash{position:absolute;left:-15%;top:50%;width:130%;height:5px;border-radius:9px;pointer-events:none;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 14px 4px rgba(255,255,255,.9),0 0 26px 6px rgba(255,214,102,.8);transform:rotate(-14deg) scaleX(0);transform-origin:left center;animation:slash .3s ease-out forwards;}
@keyframes slash{0%{transform:rotate(-14deg) scaleX(0);opacity:1}70%{transform:rotate(-14deg) scaleX(1);opacity:1}100%{transform:rotate(-14deg) scaleX(1);opacity:0}}
.spa-text{position:absolute;top:6%;right:6%;font-weight:900;font-size:clamp(22px,5vmin,44px);color:#ff5e8a;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;pointer-events:none;animation:spaText .5s ease-out forwards;}
@keyframes spaText{0%{transform:scale(.3) rotate(-15deg);opacity:0}40%{transform:scale(1.2) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:0}}

.formula{display:flex;justify-content:center;align-items:center;gap:.25em;font-weight:900;font-size:clamp(40px,10.5vmin,96px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.formula .op{color:#8b80b0;font-size:.85em;}
.formula .qm{color:#f59e0b;display:inline-block;min-width:.8em;text-align:center;}
.formula .qm.ok{color:var(--green-dk);animation:okPop .35s ease-out;}
.formula .qm.show-ans{color:#ea580c;animation:okPop .35s ease-out;}
.formula.enter{animation:fIn .25s ease-out;}
.formula.shake{animation:shake .35s;}
@keyframes fIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes okPop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.hint{min-height:1.5em;text-align:center;font-weight:700;font-size:clamp(13px,2.5vmin,20px);color:#b45309;line-height:1.3;}
.hint.good{color:var(--green-dk);}

.toast{
  position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:3px 14px 3px 4px;
  font-weight:900;font-size:clamp(13px,2.4vmin,19px);white-space:nowrap;box-shadow:0 4px 0 rgba(59,47,92,.18);border:3px solid #e9d5ff;opacity:0;
}
.toast .gem{width:clamp(30px,5vmin,44px);height:clamp(30px,5vmin,44px);}
.toast.pop{animation:toast 1.5s ease-out forwards;}
@keyframes toast{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.08);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}

.choices{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(10px,1.8vmin,16px);height:clamp(150px,32vh,300px);}
.choice{position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(38px,9vmin,84px);border-radius:24px;background:linear-gradient(180deg,#ffffff,#f1eeff);border:4px solid #d8d0ff;box-shadow:0 7px 0 #a99be6;color:var(--ink);transition:transform .08s, box-shadow .08s, background .2s, opacity .2s;}
.choice:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #a99be6;}
.choice:disabled{cursor:default;}
.choice .kn{position:absolute;left:10px;top:8px;font-size:clamp(11px,1.8vmin,15px);width:1.8em;height:1.8em;line-height:1.8em;border-radius:50%;background:#ece8ff;color:#7c6fb0;text-align:center;}
.choice .mark{position:absolute;right:12px;top:6px;font-size:clamp(22px,4.4vmin,40px);line-height:1;}
.choice.correct{background:linear-gradient(180deg,#bbf7d0,#4ade80);border-color:#16a34a;box-shadow:0 7px 0 #15803d;color:#064e3b;animation:btnOk .3s ease-out;z-index:1;}
@keyframes btnOk{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.choice.correct .mark{color:#15803d;}
.choice.reveal{background:#ecfdf5;border:4px dashed #16a34a;box-shadow:0 7px 0 #86efac;color:#15803d;animation:pulse .7s ease-in-out infinite;}
.choice.reveal .mark{color:#15803d;}
.choice.wrong{background:#f1f1f4;border-color:#d4d4dc;box-shadow:0 3px 0 #c4c4cc;color:#a1a1aa;transform:translateY(4px);}
.choice.wrong .mark{color:var(--red);}
.choice.dim{opacity:.45;}
.choices.locked .choice{pointer-events:none;}

.combo{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;font-weight:900;font-size:clamp(34px,9vmin,84px);color:#ff4f81;text-align:center;line-height:1.05;white-space:nowrap;text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,6px 7px 0 rgba(59,47,92,.25);opacity:0;}
.combo b{font-size:1.35em;color:#ff9f1c;}
.combo small{display:block;font-size:.55em;color:#7c3aed;}
.combo.pop{animation:comboPop .95s ease-out forwards;}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2);opacity:1}70%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.95);opacity:0}}

.countdown{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:rgba(255,255,255,.6);font-weight:900;font-size:clamp(70px,22vmin,200px);color:#3b82f6;text-shadow:4px 4px 0 #fff,-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,8px 10px 0 rgba(59,47,92,.2);}
.countdown.show{display:flex;}
.countdown.small{font-size:clamp(44px,12vmin,110px);color:#ff5e8a;}
.countdown span{display:inline-block;animation:cd .6s ease-out;}
.countdown .cd-rule{font-size:clamp(16px,3.4vmin,28px);color:#be123c;text-shadow:none;background:#fff;border-radius:16px;padding:6px 16px;margin-top:10px;box-shadow:0 4px 0 rgba(59,47,92,.15);}
@keyframes cd{0%{transform:scale(2.2);opacity:0}40%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:1}}

/* ================= 宝石（SVG） ================= */
.gem{display:block;overflow:visible;}
.gem .aura{transform-origin:50px 52px;animation:auraSpin 6s linear infinite;}
.gem .twinkle{animation:twinkle 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
@keyframes auraSpin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

/* ================= ほうせきばこ（図鑑） ================= */
.z-top{display:flex;align-items:center;gap:10px;padding-right:62px;min-height:52px;}
.z-top h2{flex:1;text-align:center;font-size:clamp(20px,4.4vmin,36px);font-weight:900;color:#6d28d9;}
.z-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;}
.z-sum span{font-size:clamp(11px,2vmin,16px);font-weight:900;background:#fff;border-radius:12px;padding:3px 10px;box-shadow:0 2px 0 rgba(59,47,92,.12);white-space:nowrap;}
.z-sum span.main{background:#6d28d9;color:#fff;}
.z-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center;}
.z-gridwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
.z-grid{display:grid;grid-template-columns:calc(var(--cs)*1.25) repeat(9,var(--cs));grid-auto-rows:var(--cs);gap:3px;--cs:32px;background:rgba(255,255,255,.7);padding:6px;border-radius:18px;}
.z-head{font-size:calc(var(--cs)*.32);font-weight:900;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
.z-row{display:flex;align-items:center;justify-content:center;gap:2px;border-radius:10px;font-weight:900;font-size:calc(var(--cs)*.34);background:#f5f3ff;white-space:nowrap;}
.z-row.comp{background:linear-gradient(135deg,#fff3b0,#ffd166);color:#7a4b00;}
.z-cell{border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:2px;box-shadow:0 2px 0 rgba(59,47,92,.08);}
.z-cell .gem{width:100%;height:100%;}
.z-cell.sel{outline:3px solid #8b5cf6;outline-offset:1px;}
.z-cell.lv4{background:radial-gradient(circle,#fff7d1,#fff);}
.z-detail{
  width:min(100%,640px);background:#fff;border-radius:20px;padding:8px 12px;box-shadow:var(--shadow);border:3px solid #ede9fe;
  display:flex;align-items:center;gap:12px;min-height:clamp(90px,15vh,140px);
}
.z-detail .gem{width:clamp(70px,13vh,110px);height:clamp(70px,13vh,110px);flex:none;}
.zd-text{display:flex;flex-direction:column;gap:3px;min-width:0;}
.zd-q{font-size:clamp(20px,4.4vmin,34px);font-weight:900;}
.zd-lv{font-size:clamp(13px,2.4vmin,19px);font-weight:900;color:#6d28d9;}
.zd-next{font-size:clamp(12px,2.2vmin,17px);font-weight:700;color:var(--ink-soft);line-height:1.35;}
.z-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;width:min(100%,640px);margin:0 auto;font-size:clamp(11px,1.9vmin,14px);font-weight:700;color:var(--ink-soft);}

@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .play-main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);}
  .choices{height:auto;}
  .modes{flex-direction:row;width:min(100%,980px);}
  .mode{max-height:none;flex-direction:column;justify-content:center;text-align:center;gap:6px;}
  .m-text{align-items:center;}
  .m-text b{white-space:normal;}
  .m-text .stamp{align-self:center;}
  .sub-row{width:min(100%,980px);}
  .t-head{flex-direction:row;justify-content:center;gap:24px;padding-right:62px;}
  .logo{text-align:left;}
  .z-body{flex-direction:row;align-items:stretch;}
  .z-detail{width:clamp(220px,30vw,340px);flex-direction:column;justify-content:center;text-align:center;}

}

  .race{padding:4px 10px;gap:3px;}

}

}

/* ================= リザルト画面 ================= */
.r-card{
  flex:1;min-height:0;width:min(100%,640px);margin:0 auto;background:rgba(255,255,255,.92);border-radius:28px;
  box-shadow:var(--shadow);border:4px solid #fff;padding:clamp(8px,1.6vh,18px) clamp(12px,3vmin,24px);

.r-sub{font-size:clamp(12px,2.4vmin,19px);font-weight:700;color:var(--ink-soft);text-align:center;}

.r-miss{display:none;align-self:stretch;background:#fff7ed;border:3px solid #fed7aa;border-radius:16px;padding:6px 12px;text-align:center;}

.r-miss .mq{font-size:clamp(22px,5vmin,40px);font-weight:900;}
.r-miss .mq b{color:#ea580c;}
.r-miss .mh{font-size:clamp(12px,2.3vmin,17px);font-weight:700;color:#9a3412;}
.r-sec{align-self:stretch;font-weight:900;font-size:clamp(13px,2.4vmin,18px);border-top:3px dashed #e5e0f5;padding-top:6px;}
.r-gems{align-self:stretch;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;--gw:clamp(58px,10vmin,88px);}
.gcard{width:var(--gw);height:calc(var(--gw)*1.4);perspective:600px;cursor:pointer;}
.gcard-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;}
.gcard.flip .gcard-in{transform:rotateY(180deg);}
.gface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;background:#fff;border:3px solid #e5e0f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:clamp(10px,1.7vmin,13px);font-weight:900;padding:3px;text-align:center;line-height:1.15;}

.gface.lv3{border-color:#c4b5fd;background:linear-gradient(160deg,#fff,#f5f3ff);}

.r-gnote{font-size:clamp(11px,2vmin,15px);font-weight:700;color:var(--ink-soft);text-align:center;}
.r-fb{align-self:stretch;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:5px;}
.fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8f6ff;border-radius:14px;padding:4px 10px;}
.fb-q{font-weight:900;font-size:clamp(16px,3.2vmin,26px);flex:1;white-space:nowrap;}
.tag{font-size:clamp(11px,2vmin,15px);font-weight:900;padding:2px 9px;border-radius:10px;white-space:nowrap;}
.tag.miss{background:#ffe4e6;color:#be123c;}
.tag.slow{background:#fef3c7;color:#92400e;}
.fb-note{font-size:clamp(11px,2vmin,15px);font-weight:700;color:var(--ink-soft);text-align:center;}
.fb-perfect{font-size:clamp(15px,3vmin,22px);font-weight:900;color:var(--green-dk);text-align:center;padding:4px;}
.r-btns{display:flex;gap:12px;width:min(100%,640px);margin:0 auto;}
.r-btns .btn{flex:1;white-space:nowrap;font-size:clamp(14px,3vmin,24px);font-weight:900;padding:clamp(12px,2.4vh,20px) 8px;}
#againBtn{background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;box-shadow:0 6px 0 #15803d;text-shadow:0 2px 0 rgba(0,0,0,.2);}

/* ================= エフェクト層 ================= */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.sparkle{position:absolute;font-size:clamp(16px,3.4vmin,30px);animation:sparkle 1.1s ease-out forwards;}
@keyframes sparkle{0%{transform:scale(0) rotate(0);opacity:0}30%{transform:scale(1.2) rotate(40deg);opacity:1}100%{transform:translateY(-40px) scale(.4) rotate(160deg);opacity:0}}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards;}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r));}}
</style>

<body>
<div id="app">

  <button id="muteBtn" aria-label="おとの オン・オフ">🔊</button>

  <!-- ===== タイトル・モード選択 ===== -->

      <div class="lane ghost" id="ghostLane"><span class="lane-label">ゴースト</span><div class="track"><div class="fill gh" id="ghFill"><span class="head">👻</span></div><span class="nobest">まだ きろく なし</span></div></div>

    <div class="r-card">
      <div class="r-title" id="rTitle">🎉 クリア！ 🎉</div>

      <div class="r-sub" id="rSub"></div>

      <div class="r-miss" id="rMiss"></div>

    <div class="r-btns">
      <button class="btn" id="againBtn">🔁 もういちど ちょうせん</button>
      <button class="btn" id="toTitleBtn">🏠 タイトルへ もどる</button>

  </section>

  <!-- ===== ほうせきばこ ===== -->
  <section id="zukan" class="screen">
    <div class="z-top">
      <button class="mini" id="zBack">← もどる</button>

      <span>たて＝わる数の だん　よこ＝こたえ</span>
      <button class="mini" id="weakReset">にがて きろくを リセット</button>
    </div>
  </section>
</div>
<div id="fx"></div>

<script>
(function(){
'use strict';

/* ================= 定数 ================= */
var KEY = 'supattoWarizan_';
var TOTAL_Q = 10;
var SLOW_SEC = 3.5;
var WEAK_RATE = 0.4;
var FEVER_COMBO = 5;

var MODES = {
  all:  { name:'ぜんぶの だん',   sub:'1〜9の だん',        icon:'🌈', divs:[1,2,3,4,5,6,7,8,9] },
  easy: { name:'やさしい だん',   sub:'2・3・4・5の だん',  icon:'🌱', divs:[2,3,4,5] },
  hard: { name:'むずかしい だん', sub:'6・7・8・9の だん',  icon:'🔥', divs:[6,7,8,9] },
  toku: { name:'にがて とっくん', sub:'にがて問題・ひびの ほうせき', icon:'🔥', divs:[1,2,3,4,5,6,7,8,9] }
};
var MODE_ORDER = ['all','easy','hard'];

var TITLES = [
  { n:0,    t:'わり算みならい',     e:'🐣' },
  { n:30,   t:'わり算ルーキー',     e:'🐥' },
  { n:100,  t:'わり算ファイター',   e:'⚔️' },
  { n:250,  t:'わり算エキスパート', e:'💎' },
  { n:500,  t:'わり算マスター',     e:'👑' },
  { n:1000, t:'わり算レジェンド',   e:'🌟' }
];

var GROUP_COLORS = ['#ff6b8b','#ffa94d','#ffd43b','#51cf66','#38d9a9','#4dabf7','#748ffc','#b197fc','#f783ac'];

/* 宝石：わる数の だん ごとに 1しゅるい */
var GEMS = [null,
  { name:'ルビー',         c1:'#ffb3c1', c2:'#e11d48', c3:'#881337' },
  { name:'サンストーン',   c1:'#ffd2a8', c2:'#f97316', c3:'#9a3412' },
  { name:'トパーズ',       c1:'#fff3a3', c2:'#eab308', c3:'#854d0e' },
  { name:'エメラルド',     c1:'#b4f5d8', c2:'#10b981', c3:'#065f46' },
  { name:'アクアマリン',   c1:'#c2f7fd', c2:'#06b6d4', c3:'#155e75' },
  { name:'サファイア',     c1:'#bcd7ff', c2:'#3b82f6', c3:'#1e3a8a' },
  { name:'アメジスト',     c1:'#e2d4ff', c2:'#8b5cf6', c3:'#4c1d95' },
  { name:'ローズクォーツ', c1:'#ffd1e8', c2:'#ec4899', c3:'#9d174d' },
  { name:'ダイヤモンド',   c1:'#ffffff', c2:'#bfe0ff', c3:'#5b7fa8' }
];
var LV_NAME  = ['まだ 見つけて いない','げんせき','カット','ピカピカ','かがやき'];
var LV_ICON  = ['？','🪨','✂️','✨','🌟'];
var LV_STARS = ['','★','★★','★★★','★★★★'];

/* ================= 保存 ================= */
function load(k, def){
  try{
    var v = localStorage.getItem(KEY + k);
    if(v === null) return def;
    var p = JSON.parse(v);
    return (p === null || p === undefined) ? def : p;
  }catch(e){ return def; }
}
function save(k, v){ try{ localStorage.setItem(KEY + k, JSON.stringify(v)); }catch(e){} }
function isObj(o){ return o && typeof o === 'object' && !Array.isArray(o); }

var best   = load('best', {});
var weak   = load('weak', {});
var total  = load('total', 0);
var muted  = load('muted', false);
var clears = load('clears', {});
var gems   = load('gems', { cards:{} });
if(!isObj(best)) best = {};
if(!isObj(weak)) weak = {};
if(!isObj(clears)) clears = {};
if(!isObj(gems) || !isObj(gems.cards)) gems = { cards:{} };
if(typeof total !== 'number' || !isFinite(total)) total = 0;

/* ================= 道具 ================= */
function $(id){ return document.getElementById(id); }
function rand(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function fmt(sec){ return (Math.floor(sec * 10) / 10).toFixed(1); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function today(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function showScreen(id){
  var list = document.querySelectorAll('.screen');
  for(var i = 0; i < list.length; i++) list[i].classList.toggle('active', list[i].id === id);
}
function parseKey(k){
  var p = String(k).split('÷');
  if(p.length !== 2) return null;
  var a = parseInt(p[0], 10), b = parseInt(p[1], 10);
  if(!(b >= 1 && b <= 9) || !(a >= 1) || a % b !== 0) return null;
  var ans = a / b;
  if(ans < 1 || ans > 9) return null;
  return { a:a, b:b, ans:ans, key:a + '÷' + b };
}
function getTitle(n){
  var cur = TITLES[0], next = TITLES[1] || null;
  for(var i = 0; i < TITLES.length; i++){ if(n >= TITLES[i].n){ cur = TITLES[i]; next = TITLES[i + 1] || null; } }
  return { cur:cur, next:next };
}

/* ================= 宝石の絵（SVG） ================= */
var gemUid = 0;
function regPoly(n, r, rotDeg){
  var pts = [];
  for(var i = 0; i < n; i++){
    var a = (rotDeg * Math.PI / 180) + i * 2 * Math.PI / n - Math.PI / 2;
    pts.push([50 + r * Math.cos(a), 52 + r * Math.sin(a)]);
  }
  return pts;
}
function heartPts(){
  var pts = [];
  for(var i = 0; i < 16; i++){
    var t = i / 16 * 2 * Math.PI;
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push([50 + x * 2.55, 48 - y * 2.55]);
  }
  return pts;
}
var SHAPES = [null,
  regPoly(8, 40, 22.5),                                                                      // 1 ルビー：まる
  [[16,20],[84,20],[84,86],[16,86]],                                                          // 2 四角
  regPoly(3, 46, 0).map(function(p){ return [p[0], p[1] + 8]; }),                             // 3 三角
  [[24,14],[76,14],[88,26],[88,80],[76,92],[24,92],[12,80],[12,26]],                          // 4 エメラルドカット
  regPoly(5, 42, 0),                                                                          // 5 五角
  regPoly(6, 42, 0),                                                                          // 6 六角
  [[6,52],[20,36],[36,28],[50,26],[64,28],[80,36],[94,52],[80,68],[64,76],[50,78],[36,76],[20,68]], // 7 マーキス
  heartPts(),                                                                                 // 8 ハート
  [[28,20],[72,20],[94,42],[50,94],[6,42]]                                                    // 9 ダイヤ
];
function centroid(pts){ var x = 0, y = 0; pts.forEach(function(p){ x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; }
function scalePts(pts, s, ox, oy){
  var c = centroid(pts);
  return pts.map(function(p){ return [(p[0] - c[0]) * s + (ox === undefined ? c[0] : ox), (p[1] - c[1]) * s + (oy === undefined ? c[1] : oy)]; });
}
function ptsStr(pts){ return pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
function star4(cx, cy, r){
  return 'M' + cx + ',' + (cy - r) + ' Q' + cx + ',' + cy + ' ' + (cx + r) + ',' + cy + ' Q' + cx + ',' + cy + ' ' + cx + ',' + (cy + r) +
         ' Q' + cx + ',' + cy + ' ' + (cx - r) + ',' + cy + ' Q' + cx + ',' + cy + ' ' + cx + ',' + (cy - r) + 'Z';
}
function gemSVG(dan, lv, crack){
  var id = 'gm' + (++gemUid);
  var G2 = GEMS[dan];
  var s = '<svg class="gem" viewBox="0 0 100 100" aria-hidden="true">';
  if(lv <= 0){
    s += '<circle cx="50" cy="52" r="40" fill="#efebfa" stroke="#cfc8e6" stroke-width="3" stroke-dasharray="7 6"/>' +
         '<text x="50" y="66" text-anchor="middle" font-size="40" font-weight="900" fill="#b4abd0">?</text></svg>';
    return s;
  }
  var shape = SHAPES[dan];
  s += '<defs>' +
       '<linearGradient id="' + id + 'a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + G2.c1 + '"/><stop offset=".55" stop-color="' + G2.c2 + '"/><stop offset="1" stop-color="' + G2.c3 + '"/></linearGradient>' +
       '<linearGradient id="' + id + 'r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4c9d2"/><stop offset="1" stop-color="#6b7280"/></linearGradient>' +

/* ================= 宝石のルール ================= */
function cardOf(key){ return gems.cards[key] || { lv:0 }; }
function saveGems(){ save('gems', gems); }

/* せいかい したときに 宝石を すすめる（1日1だんかいまで）。できごとを かえす */
function gemCorrect(q, dt, mode){
  var c = gems.cards[q.key] || { lv:0, d:'', crack:false, fix:0 };
  var t = today(), ev = null;
  if(c.crack){
    c.fix = (c.fix || 0) + 1;
    if(c.fix >= 2){ c.crack = false; c.fix = 0; ev = { type:'fix', from:c.lv, to:c.lv }; }
    else ev = { type:'fixing', from:c.lv, to:c.lv };
  }else if(c.lv === 0){
    c.lv = 1; c.d = t; ev = { type:'new', from:0, to:1 };
  }else if(c.d < t){
    if(c.lv === 1 || c.lv === 2){ ev = { type:'grow', from:c.lv, to:c.lv + 1 }; c.lv++; c.d = t; }
    else if(c.lv === 3 && mode === 'all' && dt < SLOW_SEC){ ev = { type:'grow', from:3, to:4 }; c.lv = 4; c.d = t; }
  }
  gems.cards[q.key] = c;
  saveGems();
  return ev;
}
/* まちがえたとき：もっている 宝石に ひびが 入る（だんかいは きえない） */
function gemWrong(q){
  var c = gems.cards[q.key];
  if(!c || c.lv < 1) return null;
  var was = c.crack;
  c.crack = true; c.fix = 0;
  saveGems();
  return was ? null : { type:'crack', from:c.lv, to:c.lv };
}
function gemStats(){
  var s = { got:0, lv:[0,0,0,0,0], crack:0, growToday:0 };
  var t = today();
  for(var b = 1; b <= 9; b++) for(var n = 1; n <= 9; n++){
    var c = gems.cards[(b * n) + '÷' + b];
    var lv = c ? c.lv : 0;
    s.lv[lv]++;
    if(lv >= 1) s.got++;
    if(c && c.crack) s.crack++;
    if(c && !c.crack && lv >= 1 && lv <= 3 && c.d < t) s.growToday++;
  }
  return s;
}
function nextGoal(q, c){
  var t = today();
  if(c.lv === 0) return 'この 問題に せいかいすると、げんせきが 見つかるよ！';
  if(c.crack) return '💔 ひびが 入っているよ。2回 つづけて せいかいすると なおるよ（いま ' + (c.fix || 0) + '/2）。「にがて とっくん」が おすすめ！';
  var when = (c.d < t) ? 'きょう' : 'あした いこうに';
  if(c.lv === 1) return when + ' せいかいすると、✂️ カット されるよ！';
  if(c.lv === 2) return when + ' せいかいすると、✨ ピカピカに なるよ！';
  if(c.lv === 3) return when + '「ぜんぶの だん」で ' + SLOW_SEC + 'びょう より はやく せいかいすると、🌟 かがやくよ！';
  return '🌟 さいこうの かがやき！ この ちょうしで まもってね。';
}

/* ================= サウンド ================= */
var AC = null;
function ensureAudio(){
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); }
    if(AC && AC.state === 'suspended') AC.resume();
  }catch(e){}
}
function tone(freq, start, dur, type, vol, freqEnd){
  if(muted || !AC) return;
  try{
    var t = AC.currentTime + (start || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
var SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77];
function noteFreq(i){ return SCALE[i % 7] * Math.pow(2, Math.floor(i / 7)); }
function sndCorrect(combo){
  var f = noteFreq(Math.min(Math.max(combo - 1, 0), 14));
  tone(f, 0, 0.16, 'square', 0.09);
  tone(f * 2, 0, 0.12, 'sine', 0.07);
  tone(f * 1.5, 0.07, 0.22, 'triangle', 0.10);
}
function sndSlice(){
  if(muted || !AC) return;
  try{
    var t = AC.currentTime + 0.04, dur = 0.22;
    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
    bp.frequency.setValueAtTime(1800, t);
    bp.frequency.exponentialRampToValueAtTime(9000, t + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + dur + 0.02);
  }catch(e){}
  tone(1400, 0.04, 0.16, 'sine', 0.06, 4200);
}

/* ================= 出題 ================= */
var G = null;

function makeChoices(q){
  var a = q.a, b = q.b, ans = q.ans, set = [];
  function add(v){ if(set.length < 3 && v >= 1 && v <= 9 && v !== ans && set.indexOf(v) < 0) set.push(v); }
  var near = shuffle([ans + 1, ans - 1]);
  add(b); add(near[0]); add(a - b); add(near[1]);
  var guard = 0;
  while(set.length < 3 && guard < 100){ add(rand(1, 9)); guard++; }
  return shuffle([ans].concat(set));
}
function weightedPick(list, wfn){
  var sum = list.reduce(function(s, x){ return s + wfn(x); }, 0);
  var r = Math.random() * sum;
  for(var i = 0; i < list.length; i++){ r -= wfn(list[i]); if(r <= 0) return list[i]; }
  return list[list.length - 1];
}
function makeQuestion(){
  var q = null;
  if(G.mode === 'toku'){
    if(G.pool.length < 3 && G.count % 2 === 1){
      // にがて問題が すくないときは、1もんおきに ほかの問題を まぜる
      var inPool = {};
      G.pool.forEach(function(p){ inPool[p.key] = true; });
      var g0 = 0;
      do{
        var fb = rand(1, 9), fa = rand(1, 9);
        q = { a:fb * fa, b:fb, ans:fa, key:(fb * fa) + '÷' + fb };
        g0++;
      }while((inPool[q.key] || q.key === G.prevKey) && g0 < 50);
    }else{
      var pool = G.pool.filter(function(p){ return p.key !== G.prevKey; });
      if(pool.length === 0) pool = G.pool;
      q = weightedPick(pool, function(p){ var c = gems.cards[p.key]; return (weak[p.key] || 0) + ((c && c.crack) ? 3 : 0) + 1; });
    }
  }else{
    var divs = MODES[G.mode].divs;
    var weakList = Object.keys(weak)
      .filter(function(k){ return weak[k] >= 1; }).map(parseKey)
      .filter(function(p){ return p && divs.indexOf(p.b) >= 0 && p.key !== G.prevKey; });
    if(weakList.length > 0 && Math.random() < WEAK_RATE){
      q = weightedPick(weakList, function(p){ return weak[p.key]; });
    }else{
      var guard = 0;
      do{
        var b = pick(divs), ans = rand(1, 9);
        q = { a:b * ans, b:b, ans:ans, key:(b * ans) + '÷' + b };
        guard++;
      }while(q.key === G.prevKey && guard < 50);
    }
  }
  q = { a:q.a, b:q.b, ans:q.ans, key:q.key };
  q.isWeak = (weak[q.key] || 0) >= 1;
  var gc = gems.cards[q.key];
  q.isCrack = !!(gc && gc.crack);
  q.choices = makeChoices(q);
  q.miss = 0;
  return q;
}
function addWeak(key, delta){
  var v = Math.max(0, (weak[key] || 0) + delta);
  if(v === 0) delete weak[key]; else weak[key] = v;
  save('weak', weak);
}

/* ================= ブロック ================= */
function fitBlocks(area, content, n){
  var W = area.clientWidth, H = area.clientHeight;
  var s = Math.floor(Math.sqrt((W * H) / (n * 2.4)));
  s = Math.max(6, Math.min(36, s));
  area.style.setProperty('--s', s + 'px');
  var guard = 0;
  while((content.offsetHeight > H - 4 || content.offsetWidth > W - 2) && s > 5 && guard < 30){
    s = Math.max(5, Math.floor(s * 0.9));
    area.style.setProperty('--s', s + 'px');
    guard++;
  }
}
function renderBlocks(q){
  var area = $('blocks');
  area.innerHTML = '';
  var pile = document.createElement('div');
  pile.className = 'pile';
  for(var i = 0; i < q.a; i++){
    var bl = document.createElement('span');
    bl.className = 'blk';
    bl.style.animationDelay = Math.min(i * 6, 240) + 'ms';
    pile.appendChild(bl);
  }
  area.appendChild(pile);
  fitBlocks(area, pile, q.a);
}
function splitBlocks(q){
  var area = $('blocks');
  area.innerHTML = '';
  var groups = document.createElement('div');
  groups.className = 'groups';
  var cols = Math.ceil(Math.sqrt(q.b));
  var mid = (q.ans - 1) / 2;
  for(var g = 0; g < q.ans; g++){
    var gr = document.createElement('div');
    gr.className = 'grp';
    gr.style.gridTemplateColumns = 'repeat(' + cols + ', var(--s))';
    gr.style.setProperty('--c', GROUP_COLORS[g % GROUP_COLORS.length]);
    gr.style.setProperty('--dx', 'calc(var(--s) * ' + ((mid - g) * 1.1).toFixed(2) + ')');
    for(var k = 0; k < q.b; k++){ var bl = document.createElement('span'); bl.className = 'blk'; gr.appendChild(bl); }
    groups.appendChild(gr);
  }
  area.appendChild(groups);
  fitBlocks(area, groups, q.a + q.ans * 3);
  var slash = document.createElement('div'); slash.className = 'slash'; area.appendChild(slash);
  var t = document.createElement('div'); t.className = 'spa-text'; t.textContent = 'スパッ！'; area.appendChild(t);
}

/* ================= ゲームの流れ ================= */
var choiceBtns = Array.prototype.slice.call(document.querySelectorAll('.choice'));

function setFever(on){
  var isOn = document.body.classList.contains('fever');
  if(on === isOn) return;
  document.body.classList.toggle('fever', on);
  $('feverBadge').classList.toggle('show', on);
  if(G){ clearInterval(G.feverTimer); G.feverTimer = null; }
  if(on && G) G.feverTimer = setInterval(spawnSparkle, 170);
}
function updateComboSmall(){
  var el = $('comboSmall');
  if(G && G.combo >= 2){ el.textContent = '🔗 ' + G.combo + ' コンボ'; el.classList.add('show'); }
  else el.classList.remove('show');
}

function startGame(mode){
  ensureAudio();
  stopGame();
  var isToku = (mode === 'toku');
  var pool = isToku ? tokuPool() : null;
  if(isToku && pool.length === 0){ renderTitle(); showScreen('title'); return; }
  G = {
    mode:mode, count:0, combo:0, maxCombo:0, start:0, q:null, qStart:0,
    log:[], lock:true, prevKey:null, finished:false, elapsed:0,
    total: isToku ? (pool.length < 3 ? 6 : Math.min(TOTAL_Q, pool.length * 3)) : TOTAL_Q,
    pool:pool,
    ghostT:(!isToku && typeof best[mode] === 'number') ? best[mode] : null,
    titleBefore:getTitle(total).cur.t, timers:[], raf:0, feverTimer:null,
    gemEvents:{}, missQ:null
  };
  var game = G;
  showScreen('play');
  document.body.classList.remove('fever');
  $('feverBadge').classList.remove('show');
  $('weakBadge').classList.remove('show');
  $('crackBadge').classList.remove('show');
  $('timer').textContent = '0.0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = G.total;
  $('meFill').style.width = '0%';
  $('ghFill').style.width = '0%';
  $('ghostLane').classList.toggle('empty', !G.ghostT);
  $('ghostLane').classList.toggle('hide', isToku);
  var rn = $('ruleNote');
  rn.className = 'rule-note' + (isToku ? ' toku' : '');
  rn.textContent = isToku ? '🔥 とっくん：まちがえても ヒントで もう一回 ちょうせん できるよ' : '⚠️ 1もん でも まちがえたら おわり！ よく 見て スパッと こたえよう';
  $('hint').textContent = ''; $('hint').className = 'hint';
  $('formula').innerHTML = '<span class="qm">？</span><span class="op">÷</span><span class="qm">？</span>';
  $('blocks').innerHTML = '';
  updateComboSmall();
  choiceBtns.forEach(function(b){ b.disabled = true; b.className = 'choice'; b.innerHTML = ''; });

  var cd = $('countdown');
  var seq = ['3', '2', '1', 'スタート！'];
  var i = 0;
  cd.classList.add('show');
  function step(){
    if(G !== game) return;
    if(i < seq.length){
      cd.classList.toggle('small', i === 3);
      cd.innerHTML = '<span>' + seq[i] + '</span>' + (i === 0 ? '<div class="cd-rule">' + (isToku ? '🔥 にがて とっくん' : '⚠️ 1もん まちがえたら おわり') + '</div>' : '');
      sndBeep(i === 3);
      i++;
      game.timers.push(setTimeout(step, i === 1 ? 900 : (i === 4 ? 520 : 620)));
    }else{
      cd.classList.remove('show');
      beginPlay();
    }
  }
  step();
}
function beginPlay(){
  G.start = performance.now();
  nextQuestion();
  G.raf = requestAnimationFrame(tick);
}
function stopGame(){
  if(!G) return;
  G.finished = true;
  G.timers.forEach(function(t){ clearTimeout(t); });
  cancelAnimationFrame(G.raf);
  clearInterval(G.feverTimer);
  document.body.classList.remove('fever');
  $('countdown').classList.remove('show');
}
function tick(){
  if(!G || G.finished) return;
  var el = (performance.now() - G.start) / 1000;
  $('timer').textContent = fmt(el);
  if(G.ghostT) $('ghFill').style.width = (Math.min(1, el / G.ghostT) * 100) + '%';
  G.raf = requestAnimationFrame(tick);
}

function nextQuestion(){
  var q = makeQuestion();
  G.q = q;
  G.prevKey = q.key;
  $('qnum').textContent = Math.min(G.count + 1, G.total);
  var f = $('formula');
  f.innerHTML = '<span>' + q.a + '</span><span class="op">÷</span><span>' + q.b + '</span><span class="op">＝</span><span class="qm" id="qm">？</span>';
  f.classList.remove('shake');
  restart(f, 'enter');
  $('weakBadge').classList.toggle('show', q.isWeak && !q.isCrack);
  $('crackBadge').classList.toggle('show', q.isCrack);
  $('hint').textContent = ''; $('hint').className = 'hint';
  renderBlocks(q);
  $('choices').classList.remove('locked');
  choiceBtns.forEach(function(b, i){
    b.disabled = false;
    b.className = 'choice';
    b.innerHTML = '<span class="kn">' + (i + 1) + '</span><span class="num">' + q.choices[i] + '</span><span class="mark"></span>';
  });
  G.lock = false;
  G.qStart = performance.now();
}

function recordGemEvent(key, ev){
  if(!ev || ev.type === 'fixing') return;
  var old = G.gemEvents[key];
  if(old){ old.to = ev.to; if(ev.type === 'fix' || ev.type === 'crack') old.type = ev.type; }
  else G.gemEvents[key] = { key:key, type:ev.type, from:ev.from, to:ev.to };
}
function showToast(q, ev){
  if(!ev) return;
  var c = cardOf(q.key), txt;
  if(ev.type === 'new') txt = '🪨 げんせき 見つけた！';
  else if(ev.type === 'grow') txt = (ev.to === 2 ? '✂️ カット！' : ev.to === 3 ? '✨ ピカピカに なった！' : '🌟 かがやいた！');
  else if(ev.type === 'fix') txt = '🔧 ひびが なおった！';
  else if(ev.type === 'fixing') txt = '🔧 ひび なおし 1/2';
  else return;
  var el = $('toast');
  el.innerHTML = gemSVG(q.b, c.lv, c.crack) + '<span>' + txt + '</span>';
  restart(el, 'pop');
  if(ev.type !== 'fixing') sndGem();
}

function answer(idx){
  if(!G || G.lock || G.finished || !G.q) return;
  var btn = choiceBtns[idx];
  if(!btn || btn.disabled) return;
  ensureAudio();
  var q = G.q, v = q.choices[idx], now = performance.now();

  if(v === q.ans){
    /* ---------- せいかい ---------- */
    G.lock = true;
    $('choices').classList.add('locked');
    var dt = (now - G.qStart) / 1000;
    btn.classList.add('correct');
    btn.querySelector('.mark').textContent = '○';
    choiceBtns.forEach(function(b){ if(b !== btn) b.classList.add('dim'); });
    var qm = $('qm'); if(qm){ qm.textContent = q.ans; qm.classList.add('ok'); }

    G.combo++;
    if(G.combo > G.maxCombo) G.maxCombo = G.combo;
    G.count++;
    total++; save('total', total);

    if(q.miss === 0){ addWeak(q.key, dt >= SLOW_SEC ? +1 : -1); }
    G.log.push({ a:q.a, b:q.b, ans:q.ans, key:q.key, miss:q.miss, time:dt });

    // まちがえた あとの せいかい（とっくん）では、宝石は すすまない
    var ev = (q.miss === 0) ? gemCorrect(q, dt, G.mode) : null;
    recordGemEvent(q.key, ev);

    sndCorrect(G.combo);
    sndSlice();
    splitBlocks(q);
    showToast(q, ev);
    var h = $('hint');
    h.className = 'hint good';
    h.textContent = '○ せいかい！ ' + q.b + 'こずつ わけると ' + q.ans + 'つ に なるね';

    $('meFill').style.width = (G.count / G.total * 100) + '%';
    showCombo();
    updateComboSmall();
    if(G.combo >= FEVER_COMBO && !document.body.classList.contains('fever')){ setFever(true); sndFever(); }

    if(G.count >= G.total){
      G.finished = true;
      G.elapsed = (now - G.start) / 1000;
      cancelAnimationFrame(G.raf);
      $('timer').textContent = fmt(G.elapsed);
      var game = G;
      game.timers.push(setTimeout(function(){ if(G === game) finishGame(game.mode === 'toku' ? 'toku' : 'clear'); }, 900));
    }else{
      var g2 = G;
      G.timers.push(setTimeout(function(){ if(G === g2 && !g2.finished) nextQuestion(); }, 480));
    }
  }else{
    /* ---------- まちがい ---------- */
    btn.disabled = true;
    btn.classList.add('wrong');
    btn.querySelector('.mark').textContent = '×';
    sndWrong();
    restart($('formula'), 'shake');
    if(q.miss === 0){
      addWeak(q.key, +2);
      recordGemEvent(q.key, gemWrong(q));
    }
    q.miss++;
    G.combo = 0;
    updateComboSmall();
    setFever(false);

    if(G.mode === 'toku'){
      var hint = $('hint');
      hint.className = 'hint';
      if(q.miss === 1){
        hint.textContent = 'だいじょうぶ！ ヒント：' + q.b + ' × □ ＝ ' + q.a + ' の □ は いくつかな？';
      }else{
        var steps = [];
        for(var k = 1; k <= Math.min(q.ans, 4); k++) steps.push(q.b * k);
        hint.textContent = 'ヒント：' + q.b + 'の だんを となえよう → ' + steps.join('、') + (q.ans > 4 ? ' …' : '') + ' ' + q.a + 'に なるのは 何ばんめ？';
      }
    }else{
      gameOver(btn);
    }
  }
}

function gameOver(wrongBtn){
  var q = G.q, now = performance.now();
  G.lock = true;
  G.finished = true;
  G.elapsed = (now - G.start) / 1000;
  G.missQ = q;
  cancelAnimationFrame(G.raf);
  $('choices').classList.add('locked');
  choiceBtns.forEach(function(b, i){
    if(q.choices[i] === q.ans){ b.classList.add('reveal'); b.querySelector('.mark').textContent = '○'; }
    else if(b !== wrongBtn) b.classList.add('dim');
  });
  var qm = $('qm'); if(qm){ qm.textContent = q.ans; qm.classList.add('show-ans'); }
  var h = $('hint');
  h.className = 'hint';
  h.textContent = 'せいかいは ' + q.ans + '。' + q.b + ' × ' + q.ans + ' ＝ ' + q.a + ' だね';
  var game = G;
  game.timers.push(setTimeout(function(){ if(G === game) finishGame('over'); }, 2000));
}

function showCombo(){
  var el = $('combo');
  if(G.combo >= 2){
    var extra = (G.combo === FEVER_COMBO) ? '<small>🌈 フィーバー タイム！</small>' : '';
    el.innerHTML = '<b>' + G.combo + '</b> コンボ！' + extra;
    restart(el, 'pop');
  }
}
function spawnSparkle(){
  var fx = $('fx'), s = document.createElement('span');
  s.className = 'sparkle';
  s.textContent = pick(['✨', '⭐', '🌟', '💫', '💎']);
  s.style.left = (Math.random() * 94) + '%';
  s.style.top = (Math.random() * 90) + '%';
  fx.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1150);
}
function confetti(n){
  var fx = $('fx'), colors = ['#ff5e8a', '#ffb347', '#ffd400', '#5ee7a0', '#5aa9ff', '#b47cff'];
  for(var i = 0; i < n; i++){
    var c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + '%';
    c.style.background = pick(colors);
    c.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
    c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
    var dur = 2 + Math.random() * 1.8;
    c.style.animationDuration = dur + 's';
    c.style.animationDelay = (Math.random() * 0.8) + 's';
    fx.appendChild(c);
    (function(el, ms){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, ms); })(c, (dur + 1) * 1000);
  }
}

/* ================= リザルト ================= */
function gemCardHTML(e){
  var q = parseKey(e.key);
  var c = cardOf(e.key);
  var label;
  if(e.type === 'new') label = 'GET!';
  else if(e.type === 'grow') label = LV_NAME[e.to] + '！';
  else label = 'なおった！';
  var before = (e.type === 'new')
    ? '<div class="gface pack">💎<small>タッチ</small></div>'
    : '<div class="gface lv' + e.from + '">' + gemSVG(q.b, e.from, e.type === 'fix') + '<span>' + q.key + '</span><small>タッチ</small></div>';
  var after = '<div class="gface after lv' + c.lv + '">' + gemSVG(q.b, c.lv, c.crack) +
              '<span>' + q.key + '</span><span>' + label + '</span><span class="st">' + LV_STARS[c.lv] + '</span></div>';
  return '<div class="gcard" data-key="' + e.key + '"><div class="gcard-in">' + before + after + '</div></div>';
}

function finishGame(kind){
  var g = G;
  clearInterval(g.feverTimer);
  document.body.classList.remove('fever');
  showScreen('result');

  var rt = $('rTitle');
  var isNew = false, prev = best[g.mode];
  $('rMiss').classList.remove('show');
  if(kind === 'clear'){
    var t = Math.round(g.elapsed * 10) / 10;
    isNew = (typeof prev !== 'number') || t < prev;
    if(isNew){ best[g.mode] = t; save('best', best); }
    clears[g.mode] = (clears[g.mode] || 0) + 1; save('clears', clears);
    rt.className = 'r-title'; rt.textContent = '🎉 クリア！ 🎉';
    $('rTime').textContent = t.toFixed(1); $('rUnit').textContent = 'びょう';
    var sub = MODES[g.mode].icon + ' ' + MODES[g.mode].name + ' ・ ⭐ クリア ' + clears[g.mode] + 'かいめ ・ ';
    if(isNew && typeof prev === 'number') sub += 'まえの ベスト ' + prev.toFixed(1) + 'びょう';
    else if(isNew) sub += 'はじめての きろく！';
    else sub += 'ベスト ' + prev.toFixed(1) + 'びょう（あと ' + (t - prev).toFixed(1) + 'びょう！）';
    $('rSub').textContent = sub;
  }else if(kind === 'over'){
    rt.className = 'r-title over'; rt.textContent = 'おしい！';
    $('rTime').textContent = g.count; $('rUnit').textContent = 'もん せいかい';
    $('rSub').textContent = MODES[g.mode].icon + ' ' + MODES[g.mode].name + ' ・ ' +
      (g.count >= 7 ? 'クリアまで あと ' + (TOTAL_Q - g.count) + 'もん！' : 'つぎは 10もん クリアを めざそう！') +
      (typeof prev === 'number' ? ' ・ ベスト ' + prev.toFixed(1) + 'びょう' : '');
    var m = g.missQ;
    var mh = $('rMiss');
    mh.innerHTML = '<div class="mq">' + m.a + ' ÷ ' + m.b + ' ＝ <b>' + m.ans + '</b></div>' +
                   '<div class="mh">' + m.b + ' × ' + m.ans + ' ＝ ' + m.a + '。' + m.b + 'の だんで さがすと 見つかるよ。<br>この 問題は「にがて とっくん」で れんしゅう できるよ！</div>';
    mh.classList.add('show');
  }else{
    rt.className = 'r-title toku'; rt.textContent = '🔥 とっくん おわり！';
    $('rTime').textContent = fmt(g.elapsed); $('rUnit').textContent = 'びょう';
    var left = tokuPool().length;
    $('rSub').textContent = left === 0 ? 'にがて問題が ぜんぶ なくなったよ！ すごい！' : 'のこりの にがて問題：' + left + 'もん';
  }
  $('newRec').classList.toggle('show', isNew);

  var after = getTitle(total).cur, ru = $('rRankup');
  if(after.t !== g.titleBefore){ ru.textContent = '🏅 しょうごう アップ！「' + after.e + ' ' + after.t + '」'; ru.classList.add('show'); }
  else ru.classList.remove('show');

  // 宝石カード
  var evs = Object.keys(g.gemEvents).map(function(k){ return g.gemEvents[k]; });
  var order = { grow:0, 'new':1, fix:2, crack:3 };
  evs.sort(function(x, y){ return (order[x.type] - order[y.type]) || (y.to - x.to); });
  var shown = evs.filter(function(e){ return e.type !== 'crack'; });
  var cracks = evs.filter(function(e){ return e.type === 'crack'; });
  var MAXG = 6;
  $('rGems').innerHTML = shown.slice(0, MAXG).map(gemCardHTML).join('');
  var note = '';
  if(shown.length > MAXG) note += 'ほか ' + (shown.length - MAXG) + 'こ。';
  if(shown.length === 0 && cracks.length === 0){
    var st = gemStats();
    note += st.growToday > 0 ? 'きょう まだ そだてられる ほうせきが ' + st.growToday + 'こ あるよ！' : 'あした また せいかいすると、ほうせきが そだつよ！';
  }else if(shown.length > 0){
    note += 'カードを タッチして めくろう！';
  }
  if(cracks.length > 0) note += ' 💔 ひびが 入った：' + cracks.map(function(e){ return e.key; }).join('・') + '（とっくんで なおそう）';
  $('rGnote').textContent = note;

  // ふりかえり
  var fb = g.log.filter(function(l){ return l.miss > 0 || l.time >= SLOW_SEC; });
  var box = $('rFb');
  if(fb.length === 0){
    box.innerHTML = (kind === 'over' && g.log.length === 0)
      ? '<div class="fb-note">1もんめから また ちょうせん しよう！</div>'
      : '<div class="fb-perfect">⚡ せいかいした 問題は ぜんぶ すばやく とけたよ！</div>';
  }else{
    fb.sort(function(x, y){ return (y.miss - x.miss) || (y.time - x.time); });
    var MAX = 3, html = '';
    fb.slice(0, MAX).forEach(function(l){
      html += '<div class="fb-row"><span class="fb-q">' + l.a + ' ÷ ' + l.b + ' ＝ ' + l.ans + '</span>';
      if(l.miss > 0) html += '<span class="tag miss">× まちがえた</span>';
      if(l.time >= SLOW_SEC) html += '<span class="tag slow">🐢 ' + l.time.toFixed(1) + 'びょう</span>';
      html += '</div>';
    });
    if(fb.length > MAX) html += '<div class="fb-note">ほか ' + (fb.length - MAX) + 'もん</div>';
    box.innerHTML = html;
  }

  $('againBtn').textContent = (kind === 'toku') ? (tokuPool().length ? '🔁 もういちど とっくん' : '🏠 モードを えらぶ') : '🔁 もういちど ちょうせん';

  if(kind === 'over'){ sndOver(); }
  else { sndClear(); confetti(isNew ? 90 : 30); }
}

$('rGems').addEventListener('click', function(e){
  var c = e.target.closest('.gcard');
  if(c && !c.classList.contains('flip')){ c.classList.add('flip'); sndFlip(); }
});
$('againBtn').addEventListener('click', function(){
  if(!G) return;
  if(G.mode === 'toku' && tokuPool().length === 0){ renderTitle(); showScreen('title'); return; }
  startGame(G.mode);
});
$('toTitleBtn').addEventListener('click', function(){ stopGame(); renderTitle(); showScreen('title'); });
$('quitBtn').addEventListener('click', function(){ stopGame(); renderTitle(); showScreen('title'); });
$('choices').addEventListener('click', function(e){
  var b = e.target.closest('.choice');
  if(b) answer(parseInt(b.getAttribute('data-i'), 10));
});
document.addEventListener('keydown', function(e){
  if(!$('play').classList.contains('active')) return;
  var n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4){ e.preventDefault(); answer(n - 1); }
});
window.addEventListener('resize', function(){
  if($('zukan').classList.contains('active')){ sizeZukan(); return; }
  if(!$('play').classList.contains('active')) return;
  var area = $('blocks'), c = area.querySelector('.pile, .groups');
  if(c && G && G.q) fitBlocks(area, c, c.classList.contains('groups') ? G.q.a + G.q.ans * 3 : G.q.a);
});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ================= はじめ ================= */
renderMute();
renderTitle();
})();
</script>
